# Identity-free jj base configuration, shipped verbatim to
# ~/.config/jj/conf.d/00-base.toml on every machine class (see ./base.nix
# for the load-order contract). MUST stay free of identity keys (user.*,
# signing.*): conf.d loads after the main config.toml, so anything here
# would silently override the sops-rendered identity on personal machines.

[template-aliases]
"format_timestamp(timestamp)" = "timestamp.ago()"

[aliases]
s = ["status"]
sp = ["split"]
la = ["log", "-r", "all()"]

tug = ["bookmark", "move", "--from", "closest_bookmark(@-)", "--to", "@-"]
gp = ["git", "push"]
retrunk = ["rebase", "-d", "trunk()"]
gpa = ["util", "exec", "--", "bash", "-c",
       "jj git push --remote origin \"$@\" && jj git push --remote forge \"$@\"",
       "gpa"]

[revset-aliases]
"closest_bookmark(to)" = "heads(::to & bookmarks())"

[ui]
pager = ":builtin"
paginate = "auto"
default-command = ["log", "-s", "-n", "10"]
diff-formatter = ["difft", "--color=always", "$left", "$right"]

[ui.streampager]
wrapping = "word"      # wrap on word boundaries
show-ruler = false

[remotes.origin]
auto-track-bookmarks = "glob:*"
[remotes.upstream]
auto-track-bookmarks = "main"
