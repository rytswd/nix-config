# Identity sliver only: name, sops-substituted email, and the personal
# (gpg/YubiKey) signing setup. Everything identity-free lives in
# conf.d/00-base.toml (./base.toml, shipped by ./base.nix -- its header
# documents the load-order contract). Keeping this at the main config.toml
# path means personal machines never accumulate a stale full config there.
[user]
name = "Ryota"
# Email replaced by SOPS Nix. The below placeholder is in the form of:
#
#     <SOPS:**SHA256_OF_SECRET**:PLACEHOLDER>
#
# And SHA256 can be generated using
#
#     nix repl
#     > builtins.hashString "sha256" "SECRET_NAME"
#
email = "<SOPS:f3fc243059c60b962cd635b495c310bf7402fdb58ea031a43b6fe9b3a2ce150d:PLACEHOLDER>"

[signing]
behavior = "own"
backend = "gpg"
