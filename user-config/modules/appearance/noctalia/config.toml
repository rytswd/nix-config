# Noctalia v5 declarative base config (Nix-managed, read-only).
#
# Wired via `programs.noctalia.settings = ./config.toml` in ./default.nix and
# symlinked read-only to ~/.config/noctalia/config.toml. Runtime/GUI tweaks
# layer on top in ~/.local/state/noctalia/settings.toml (state dir), so the
# shell stays adjustable without editing this file.
#
# Validated at build time by `noctalia config validate` (validateConfig
# defaults to true). Full reference: https://docs.noctalia.dev/v5/ and the
# upstream example.toml. Only intentional overrides live here; everything else
# falls back to built-in defaults.

[shell]
settings_show_advanced = true
niri_overview_type_to_launch_enabled = true   # type-to-launch in the niri overview (GUI tweak)

[shell.panel]
transparency_mode = "soft"                     # panel transparency mode (GUI tweak)

[shell.screen_corners]
enabled = true                                 # rounded screen corners on (GUI tweak)
size    = 7                                    # corner radius (GUI tweak)

# ── Theme ─────────────────────────────────────────────────────────────
[theme]
mode             = "dark"
source           = "wallpaper"      # derive colours from the active wallpaper
wallpaper_scheme = "m3-rainbow"
pure_black_dark  = true             # true-black background in dark mode (GUI tweak)
# To use the bundled custom palette instead of wallpaper colours, set:
#   source         = "custom"
#   custom_palette = "Rytswd"
# The palette is declared via programs.noctalia.customPalettes and lands at
# ~/.config/noctalia/palettes/Rytswd.json (see ./palettes/Rytswd.json).

# ── Wallpaper ─────────────────────────────────────────────────────────
[wallpaper]
directory = "~/Pictures/Wallpapers"

[wallpaper.default]
path = "~/Pictures/Wallpapers/hasliberg.jpg"

[wallpaper.automation]
enabled = true

# ── Bar ───────────────────────────────────────────────────────────────
[bar]
order = ["main"]

[bar.main]
position           = "top"
enabled            = true
thickness          = 24
scale              = 0.9
background_opacity = 0.53
padding            = 10
radius             = 4
margin_ends        = 0              # full width along the main axis
margin_edge        = 0              # flush to the screen edge
capsule            = true
capsule_opacity    = 0.0
capsule_padding    = 2.0
font_weight        = 400

start  = [ "launcher", "session", "workspaces" ]
center = [ "active_window", "media" ]
end    = [
  "tray",
  "caffeine",
  "wallpaper",
  "network",
  "bluetooth",
  "volume",
  "output_volume",
  "input_volume",
  "battery",
  "control-center",
  "clock",
  "notifications",
]

# ── Dock ──────────────────────────────────────────────────────────────
[dock]
enabled             = true
auto_hide           = true
icon_size           = 24
background_opacity  = 0.36
cross_axis_padding  = 4
magnification       = true
magnification_scale = 1.2
reserve_space       = false        # auto-hide: don't reserve an exclusion zone (GUI tweak)

# ── Hot corners ───────────────────────────────────────────────────────
[hot_corners.top_left]
action = "window_switcher"         # top-left hot corner -> window switcher (GUI tweak)

# ── Widgets ───────────────────────────────────────────────────────────
[widget.battery]
display_mode = "graphic"

[widget.clock]
format         = "{:%a, %d %b, %Y  %H:%M:%S}"
tooltip_format = "{:%A, %B %d, %Y}"

[widget.control-center]
scale = 1.1

[widget.input_volume]
mute_color = "surface_variant"

[widget.launcher]
glyph = "rocket"

[widget.media]
hide_when_no_media = true
title_scroll       = "on_hover"

[widget.network]
show_label = false

[widget.notifications]
scale = 1.1

[widget.output_volume]
mute_color = "surface_variant"

[widget.tray]
drawer         = true
drawer_columns = 5

[widget.volume]
enabled = false
