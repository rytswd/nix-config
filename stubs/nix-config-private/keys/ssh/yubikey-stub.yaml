# Placeholder for the private repo's keys/ssh/yubikey-stub.yaml.
#
# The public module user-config/modules/vcs/git/yubikey.nix declares sops
# secrets whose `sopsFile` points into `inputs.nix-config-private` by path,
# so this file path is part of the consumed private interface. The Home
# Manager sops-nix module does not force the file's existence at eval time,
# but `sops-install-secrets` DOES validate the manifest at BUILD time: any
# host that declares secrets against this placeholder fails to build with
# "the key '<name>' cannot be found" (observed on the nixos-utm degraded
# build, 2026-07). It is NOT a sops file and cannot be decrypted either.
# Consequence: keyless hosts must not declare these secrets at all -- set
# `local.secrets.enable = false` in the host profile (see
# user-config/modules/lib/secrets.nix for the gating contract); the
# `coreAvailable` gate then keeps the declarations out of the manifest.
# This placeholder remains so the path itself stays resolvable.
{}
